name: Push to PWS

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Git
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'

    - name: Push to PWS
      env:
        PWS_URL: ${{ secrets.PWS_URL }}
      shell: bash
      run: |
        set -euo pipefail

        if [ -z "${PWS_URL}" ]; then
          echo "::error::PWS_URL secret is not configured."
          exit 1
        fi

        current_branch="$(git branch --show-current)"
        if [ -z "${current_branch}" ]; then
          current_branch="HEAD"
        fi

        echo "Current branch: ${current_branch}"

        if ! push_output=$(git push "${PWS_URL}" "${current_branch}:main" 2>&1); then
          echo "Push failed with output:"
          echo "${push_output}"
          echo "Error: Unable to push changes. Please check the error message above and resolve any conflicts manually."
          exit 1
        fi

        echo "Push successful with output:"
        echo "${push_output}"