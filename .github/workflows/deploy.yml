name: Push to PWS

# Deploy only after "Tests and coverage" has passed for a push to main.
on:
  workflow_run:
    workflows: [ "Tests and coverage" ]
    types: [ completed ]
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pws-deploy
  cancel-in-progress: false

jobs:
  build-and-push:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.workflow_run.head_sha || github.sha }}
        fetch-depth: 0

    - name: Set up Git
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'

    - name: Push to PWS
      env:
        PWS_URL: ${{ secrets.PWS_URL }}
      shell: bash
      run: |
        set -euo pipefail

        if [ -z "${PWS_URL}" ]; then
          echo "::error::PWS_URL secret is not configured."
          exit 1
        fi

        # PWS builds from its master branch (it has no main branch). GitHub main is
        # the source of truth, so force the mirror in case main's history was rewritten.
        if ! push_output=$(git push --force "${PWS_URL}" HEAD:refs/heads/master 2>&1); then
          echo "Push failed with output:"
          echo "${push_output}"
          echo "Error: Unable to push changes. Please check the error message above and resolve any conflicts manually."
          exit 1
        fi

        echo "Push successful with output:"
        echo "${push_output}"
