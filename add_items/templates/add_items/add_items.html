{% load static %}
<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if is_edit %} Edit Barang {% else %} Tambah Barang {% endif %}</title>
    <link rel="stylesheet" href="{% static 'details.css' %}">
    <link rel="stylesheet" href="{% static 'add.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <!-- Akan diganti dari base.html -->
    <header class="site-header">
        <div class="logo">
            <img src="{% static 'RePair..svg' %}" alt="RePair">
        </div>
    </header>

    <main class="create-page">
        <h1>{% if is_edit %}Edit Barang{% else %}Tambah Barang{% endif %}</h1>
        <div id="form-message" class="form-message" hidden></div>

        <form id="create-form" novalidate
              data-url="{% if is_edit %}{% url 'add_items:edit_ajax' barter.pk %}{% else %}{% url 'add_items:create_ajax' %}{% endif %}">
            {% csrf_token %}
            {% for field in form %}
                <div class="field">
                    {{ field.label_tag }}
                    {{ field }}
                </div>
            {% endfor %}
            <div class="bid-actions">
                <button type="submit" class="bid-confirm">Simpan</button>
            </div>
        </form>

        {% include "barter_details/components/toast.html" %}
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('create-form');
            const messageBox = document.getElementById('form-message');
            if (!form) return;

            const submitButton = form.querySelector('button[type="submit"]');

            function clearErrors() {
                form.querySelectorAll('.field-error').forEach((el) => el.remove());
                messageBox.hidden = true;
            }

            function showFieldErrors(errors) {
                Object.entries(errors).forEach(([name, list]) => {
                    const text = list.map((e) => e.message).join(' ');
                    const input = form.elements[name];
                    if (name === '__all__' || !input) {
                        showToast(text, 'error');
                        return;
                    }
                    const div = document.createElement('div');
                    div.className = 'field-error';
                    div.textContent = text;
                    input.closest('.field').appendChild(div);
                });
            }

            form.addEventListener('submit', async (event) => {
                event.preventDefault();
                clearErrors();
                submitButton.disabled = true;
                submitButton.textContent = 'Menyimpan...';

                try {
                    const response = await fetch(form.dataset.url, {
                        method: 'POST',
                        body: new FormData(form),
                        headers: { 'X-Requested-With': 'XMLHttpRequest' },
                    });
                    const data = await response.json();

                    if (response.status === 200 || response.status === 201) {
                        showToast(data.message, 'success');
                        setTimeout(() => { window.location.href = data.redirect_url; }, 800);
                    } else if (response.status === 400 && data.errors) {
                        showFieldErrors(data.errors);
                    } else {
                        showToast(data.message || 'Terjadi kesalahan.', 'error');
                    }
                } catch (err) {
                    showToast('Tidak dapat terhubung ke server. Coba lagi.', 'error');
                } finally {
                    submitButton.disabled = false;
                    submitButton.textContent = 'Simpan';
                }
            });
        });
    </script>
</body>
</html>
