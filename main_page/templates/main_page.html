{% extends 'base.html' %}
{% block title %}Beranda{% endblock %}
{% block content %}
<section class="panel" aria-label="Beranda">
    <h1>RePair</h1>

    <h2>Temukan Barang yang Kamu Butuhkan</h2>
    <p>Temukan dan tukarkan barang yang masih layak digunakan.</p>

    <input type="text" placeholder="Cari barang...">
    <button type="button">Cari</button>

    <hr>

    <h2>Rekomendasi Barang</h2>

    <div>
        <h3>Nama Barang</h3>
        <p>Kondisi: Baik</p>
        <button type="button">Tambah ke Keranjang</button>
    </div>

    <br>

    <button type="button">Post Barang</button>
</section>
{% endblock %}
